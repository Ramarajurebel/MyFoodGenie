<section class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <!-- <i class="iconsvg icon-mushroom_adobe_express"></i> -->
    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent">
        <mat-drawer
            class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="isMatDrawerOpened"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer
        >
            <div class="flex flex-auto" *ngIf="isMatDrawerOpened">
                <form
                    class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto"
                    [formGroup]="TableFieldsForm"
                >
                    <!-- Header -->
                    <div class="flex justify-between -mt-3 -ml-4">
                        <div class="toggle">
                            <!-- <mat-slide-toggle>Edit Mode</mat-slide-toggle> -->
                        </div>
                        <div class="flex items-center">
                            <!-- Close button -->
                            <a mat-icon-button (click)="OnClose()">
                                <mat-icon
                                    [svgIcon]="'heroicons_outline:x'"
                                ></mat-icon>
                            </a>
                        </div>
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>

                    <!-- Title -->
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Vendor Name:</label
                        >
                        <input
                            type="text"
                            class="form-control"
                            formControlName="vendorName"
                        />
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1">Category:</label>

                        <select class="form-control" formControlName="category">
                          <option value="">--Select--</option>
                          <option *ngFor="let all of category" [value]="all">{{ all }}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <ng-multiselect-dropdown
                        [placeholder]="'Categories'"
                        [settings]="dropdownSettings"
                        [data]="categories"
                        [formControl]="catList"
                        class="form-control-plaintext"
                    >
                    </ng-multiselect-dropdown>
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Vendor Address:</label
                        >
                        <textarea
                            class="form-control"
                            rows="5"
                            formControlName="vendorAddress"
                        ></textarea>
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Vendor Mobile:</label
                        >
                        <input
                            type="number"
                            class="form-control"
                            formControlName="vendorMobile"
                        />
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>
                    <div class="d-flex flex-row justify-content-between">
                        <button
                            class="btn btn-danger"
                            (click)="onDelPopup(deleteDialog)"
                        >
                            Delete
                        </button>
                        <button class="btn btn-primary" (click)="OnSavePopup()">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">
            <div class="flex flex-col flex-auto">
                <!-- Header -->
                <div class="flex flex-row justify-between py-8 px-6 md:px-8">
                    <!-- Title -->

                    <div
                        class="text-4xl font-extrabold tracking-tight leading-none"
                    >
                        Vendor Details
                    </div>
                    <div class="button">
                        <button
                            class="btn btn-primary"
                            (click)="isMatDrawerOpened = true"
                        >
                            Add
                        </button>
                    </div>
                </div>
                <div class="divide-y">
                    <ng-container *ngFor="let vendor of vendorsData">
                        <div
                            class="grid grid-cols-3 hover:bg-gray-100 dark:hover:bg-hover"
                            (click)="OnEdit(vendor)"
                        >
                            <div class="col-span-1 pl-2">
                                <div class="row-span-1 text-lg font-bold">
                                    {{ vendor.vendorId }}-{{
                                        vendor.vendorName
                                    }}
                                </div>
                                <div class="row-span-1 text-lg font-bold">
                                    {{ vendor.vendorMobile }}
                                </div>
                            </div>
                            <div class="col-span-1">
                                <div class="row-span-1 text-lg font-bold">
                                    Address: {{ vendor.vendorAddress }}
                                </div>
                            </div>
                            <div class="col-span-1">
                                <div class="row-span-1 text-lg font-bold">
                                    Category: {{ vendor.category }}
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>
<!-- dialog  -->
<ng-template #deleteDialog>
    <div mat-dialog-title class="dialog-title flex flex-row justify-between">
        <h4>Delete Record</h4>
        <button
            mat-icon-button
            aria-label="close dialog"
            (click)="CloseDialog()"
        >
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="mat-typography text-center">
        <p>Do you really want to delete this record?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" (click)="confirm()">
            Yes
        </button>
        <button mat-raised-button color="secondary" (click)="decline()">
            No
        </button>
    </mat-dialog-actions>
</ng-template>
