<section class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <!-- <i class="iconsvg icon-mushroom_adobe_express"></i> -->
    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent">
        <mat-drawer
            class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="isMatDrawerOpened"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer
        >
            <div class="flex flex-auto" *ngIf="isMatDrawerOpened">
                <form
                    class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto"
                    [formGroup]="TableFieldsForm"
                    *ngIf="isPurchaseCardSelected"
                >
                    <!-- Header -->
                    <div class="flex justify-between -mt-3 -ml-4">
                        <div class="flex items-center">
                            <!-- Close button -->
                            <a mat-icon-button (click)="OnClose()">
                                <mat-icon
                                    [svgIcon]="'heroicons_outline:x'"
                                ></mat-icon>
                            </a>
                        </div>
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>
                    <div class="form-group">
                        <label for="" class="mb-1">Item Id/Name</label>
                        <mat-form-field style="width: 100% !important">
                            <mat-label>Products</mat-label>
                            <mat-select
                                formControlName="itemId"
                                #singleSelect
                                class="form-control-plain-text"
                                (selectionChange)="
                                    onSelectProducts($event.source.value)
                                "
                                aria-readonly="true"
                            >
                                <mat-option>
                                    <ngx-mat-select-search
                                        [formControl]="itemControl"
                                        placeholderLabel="Search"
                                    ></ngx-mat-select-search>
                                </mat-option>

                                <mat-option
                                    *ngFor="let all of filtereditems"
                                    [value]="all.prodId"
                                >
                                    {{ all.prodId }}-{{ all.prodName }}-{{
                                        all.uom
                                    }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="form-group">
                        <label for="" class="mb-1">Sub Category/Name</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="subCategory"
                        />
                    </div>
                    <div class="form-group">
                        <label for="" class="mb-1">Quantity/</label>
                        <input
                            type="number"
                            class="form-control"
                            formControlName="quantity"
                        />
                    </div>
                    <div class="form-group">
                        <label for="" class="mb-1">UOM</label>
                        <select class="form-control" formControlName="uom">
                            <option>--Select--</option>
                            <option *ngFor="let uom of uomData" [value]="uom">
                                {{ uom }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="" class="mb-1">Price</label>
                        <input
                            type="number"
                            formControlName="price"
                            class="form-control"
                        />
                    </div>
                    <div class="form-group">
                        <label for="" class="mb-1">Sale Percentage</label>
                        <input
                            type="number"
                            formControlName="salePercentage"
                            class="form-control"
                        />
                    </div>
                    <mat-divider class="mt-6 mb-8"></mat-divider>
                    <div class="flex flex-row justify-between">
                        <button class="btn btn-primary">Delete</button>
                        <button class="btn btn-warning" (click)="OnSavePopup()">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">
            <div class="flex flex-col flex-auto">
                <!-- Header -->
                <div class="flex flex-row py-8 px-6 md:px-8">
                    <!-- Title -->
                    <div>
                        <div
                            class="text-4xl font-extrabold tracking-tight leading-none"
                        >
                            Purchase Rate Card
                        </div>
                        <div class="div header-btns">
                            <!-- <button
                                class="ml-3"
                                mat-flat-button
                                [color]="'primary'"
                                (click)="OnAdhocClick()"
                            >
                             <mat-icon
                                    [svgIcon]="'heroicons_outline:plus'"
                                ></mat-icon>


                                <span class="ml-2 mr-1">Add Item</span>
                            </button> -->
                        </div>
                    </div>
                </div>
                <mat-tab-group>
                    <mat-tab label="Suppliers"></mat-tab>
                    <mat-tab label="Items Suppliers"> Content 3 </mat-tab>
                </mat-tab-group>
                <div class="divide-y">
                    <ng-container>
                        <div *ngFor="let types of groupingCategory">
                            <div
                                class="d-flex flex-row items-center pl-3 w-100 p-3 adhoc-po"
                                (click)="activatingChild(types)"
                            >
                                <div class="d-flex flex-column w-50 adhoc">
                                    <div
                                        class="text-lg font-semibold text-primary description"
                                    >
                                        {{ types.value }}
                                    </div>
                                    <!-- purchased by only in desktops -->

                                    <!-- Amount and itemscount in mobile only -->
                                </div>
                                <div class="adhoc" style="margin-left: auto">
                                    <button
                                        mat-icon-button
                                        color="primary"
                                        (click)="activatingChild(types)"
                                    >
                                        <mat-icon>keyboard_arrow_down</mat-icon>
                                    </button>
                                </div>
                            </div>
                            <ng-container
                                class="accordion-body"
                                *ngIf="types.childActive"
                            >
                                <!-- <div
                                        class="text-lg font-semibold text-primary category p-2"
                                    >
                                        Category : {{ selectedPoCategory }}
                                    </div> -->
                                <div class="example-container">
                                    <table class="table table-bordernone">
                                        <thead>
                                            <tr>
                                                <th class="text-center">Img</th>
                                                <th>Item Id/Name</th>
                                                <th>Quantity/UOM</th>
                                                <th>Price</th>
                                                <th>Sale Price</th>

                                                <th>
                                                    <button
                                                        mat-mini-fab
                                                        (click)="open()"
                                                    >
                                                        <mat-icon>add</mat-icon>
                                                    </button>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr
                                                *ngFor="
                                                    let table of types.table
                                                        .data;
                                                    let i = index
                                                "
                                            >
                                                <td class="text-center">
                                                    <img
                                                        [src]="
                                                            ingredientsImagePath +
                                                            table.itemImage
                                                        "
                                                        onerror="this.style.display='none'"
                                                        class="w-8"
                                                    />
                                                </td>
                                                <td>
                                                    <label
                                                        >{{ table.itemId }}-{{
                                                            table.itemName
                                                        }}</label
                                                    >
                                                </td>
                                                <td>
                                                    <label
                                                        >{{ table.quantity }}
                                                        {{ table.uom }}</label
                                                    >
                                                </td>

                                                <td>
                                                    <label>{{
                                                        table.price
                                                    }}</label>
                                                </td>
                                                <td>
                                                    <label>{{
                                                        table.salePercentage
                                                    }}</label>
                                                </td>

                                                <td>
                                                    <div class="all-icons">
                                                        <mat-icon
                                                            color="accent"
                                                            (click)="
                                                                OnEdit(table)
                                                            "
                                                            >edit</mat-icon
                                                        >
                                                        <mat-icon
                                                            color="primary"
                                                            (click)="
                                                                onDelPopup(
                                                                    template,
                                                                    table
                                                                )
                                                            "
                                                            >delete</mat-icon
                                                        >
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </ng-container>
                        </div>
                    </ng-container>
                    <ng-container>
                        <!-- <div class="mobile-view">
                            <div class="row-data w-full">
                                <div
                                    class="flex flex-col"
                                    *ngFor="let data of purchaseRateData"
                                    (click)="OnEdit(data)"
                                >
                                    <div
                                        class="flex flex-row justify-between p-2"
                                    >
                                        <div class="col w-6/12">
                                            <label for="" class="mr-0"
                                                >ItemId/Name</label
                                            >
                                        </div>
                                        <div class="col w-6/12">
                                            <label for="" class="mr-0">{{
                                                data.itemId / itemName
                                            }}</label>
                                        </div>
                                    </div>
                                    <div
                                        class="flex flex-row justify-between p-2"
                                    >
                                        <div class="col w-6/12">
                                            <label for="" class="mr-0"
                                                >Quantity/UOM
                                            </label>
                                        </div>

                                        <div class="col w-6/12">
                                            <label for="" class="mr-0"
                                                >{{ data.quantity }}/{{
                                                    data.uom
                                                }}</label
                                            >
                                        </div>
                                    </div>
                                    <div
                                        class="flex flex-row justify-between p-2"
                                    >
                                        <div class="col w-6/12">
                                            <label for="" class="mr-0">
                                                Price/Sale Percentage</label
                                            >
                                        </div>

                                        <div class="col w-6/12">
                                            <label for="" class="mr-0"
                                                >{{ data.price }}/{{
                                                    data.salePercentage
                                                }}</label
                                            >
                                        </div>
                                    </div>

                                    <hr />
                                </div>
                            </div>
                        </div> -->
                    </ng-container>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>
<!-- dialog  -->
<ng-template #deleteDialog>
    <div mat-dialog-title class="dialog-title flex flex-row justify-between">
        <h4>Delete Record</h4>
        <button
            mat-icon-button
            aria-label="close dialog"
            (click)="CloseDialog()"
        >
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="mat-typography text-center">
        <p>Do you really want to delete this record?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" (click)="confirm()">
            Yes
        </button>
        <button mat-raised-button color="secondary" (click)="decline()">
            No
        </button>
    </mat-dialog-actions>
</ng-template>
