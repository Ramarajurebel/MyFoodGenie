<section class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <!-- <i class="iconsvg icon-mushroom_adobe_express"></i> -->
    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent">
        <mat-drawer
            class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="isMatDrawerOpened"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer
        >
            <div class="flex flex-auto" *ngIf="isMatDrawerOpened">
                <form
                    class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto"
                    [formGroup]="TableFieldsForm"
                >
                    <!-- Header -->
                    <div class="flex justify-between -mt-3 -ml-4">
                        <div class="toggle">
                            <!-- <mat-slide-toggle>Edit Mode</mat-slide-toggle> -->
                        </div>
                        <div class="flex items-center">
                            <!-- Close button -->
                            <a mat-icon-button (click)="OnClose()">
                                <mat-icon
                                    [svgIcon]="'heroicons_outline:x'"
                                ></mat-icon>
                            </a>
                        </div>
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>

                    <!-- Title -->
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Employee ID:</label
                        >
                        <select
                            name=""
                            id=""
                            class="form-control"
                            formControlName="employeeId"
                            (change)="OnEmployeeChange($event.target.value)"
                        >
                            <option>--Select--</option>
                            <option
                                *ngFor="let emps of empsData"
                                [value]="emps.stalloperatorid"
                            >
                                {{ emps.stalloperatorid }}-{{ emps.name }}
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Module Id:</label
                        >
                        <select
                            class="form-control"
                            required=""
                            formControlName="moduleId"
                            (change)="OnModuleChange($event.target.value)"
                        >
                            <option value="">--Select--</option>
                            <option
                                *ngFor="let all of moduleManagementData"
                                [value]="all.moduleId"
                            >
                                {{ all.moduleId }}-{{ all.moduleName }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Is Manage:</label
                        >
                        <input
                            type="checkbox"
                            class="form-check"
                            formControlName="manage"
                        />
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Is Active:</label
                        >
                        <input
                            type="checkbox"
                            class="form-check"
                            formControlName="active"
                        />
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>
                    <div class="d-flex flex-row justify-content-between">
                        <button
                            class="btn btn-danger"
                            (click)="onDelPopup(deleteDialog)"
                        >
                            Delete
                        </button>
                        <button class="btn btn-primary" (click)="OnSavePopup()">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">
            <div class="flex flex-col flex-auto">
                <!-- Header -->
                <div class="flex flex-row justify-between py-8 px-6 md:px-8">
                    <!-- Title -->

                    <div
                        class="text-4xl font-extrabold tracking-tight leading-none"
                    >
                        Event Recipes Report
                    </div>
                </div>
                <div class="mt-2">
                    <form
                        [formGroup]="orderForm"
                        class="w-100 flex flex-col gap-1 md:flex-row lg:flex-row ml-2"
                    >
                        <!-- <div class="dates"> -->

                        <div class="w-auto">
                            <mat-form-field appearance="fill">
                                <mat-label>Enter a date range</mat-label>
                                <mat-date-range-input [rangePicker]="picker">
                                    <input
                                        matStartDate
                                        placeholder="Start date"
                                        formControlName="startDate"
                                        #dateRangeStart
                                    />
                                    <input
                                        matEndDate
                                        placeholder="End date"
                                        formControlName="endDate"
                                        #dateRangeEnd
                                        (dateChange)="
                                            dateRangeChange(
                                                dateRangeStart,
                                                dateRangeEnd
                                            )
                                        "
                                    />
                                </mat-date-range-input>
                                <mat-datepicker-toggle
                                    matSuffix
                                    [for]="picker"
                                ></mat-datepicker-toggle>
                                <mat-date-range-picker
                                    #picker
                                ></mat-date-range-picker>
                            </mat-form-field>
                        </div>
                        <div class="w-2/3 mt-auto mb-auto">
                            <ng-multiselect-dropdown
                                [placeholder]="'Event Name'"
                                [settings]="dropdownSettings"
                                [data]="events"
                                formControlName="eventname"
                                class="form-control-plaintext"
                            >
                            </ng-multiselect-dropdown>
                        </div>
                        <div class="w-2/3 mt-auto mb-auto">
                            <ng-multiselect-dropdown
                                [placeholder]="'Recipe Name'"
                                [settings]="recipesettings"
                                [data]="Recipes"
                                formControlName="recipename"
                                class="form-control-plaintext"
                            >
                            </ng-multiselect-dropdown>
                        </div>
                        <div class="w-auto mt-auto mb-auto">
                            <select
                                class="form-control"
                                formControlName="category"
                            >
                                <option value="">--All--</option>
                                <option value="Kitchen">Kitchen</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                        <div class="mt-auto mb-auto">
                            <button
                                class="btn btn-primary btn-sm"
                                (click)="onSearch()"
                            >
                                Go
                            </button>
                        </div>
                    </form>
                    <div class="flex flex-row gap-2 ml-2">
                        <div class="adhocpo-btn" *ngIf="isAdhocpoVisible">
                            <button
                                class="btn btn-secondary adhocpo"
                                (click)="onExportPress()"
                            >
                                Export
                            </button>
                        </div>
                    </div>
                </div>
                <div class="divide-y">
                    <div class="final-table" style="width: 100% !important">
                        <div class="table-responsive">
                            <table
                                class="table table-bordernone"
                                id="eventTable"
                            >
                                <thead>
                                    <!-- <th>Event Recipes ID</th> -->

                                    <th
                                        *ngFor="
                                            let Keys of headingArray;
                                            let i = index
                                        "
                                    >
                                        {{ headingArray[i] }}
                                    </th>
                                </thead>
                                <tbody>
                                    <tr
                                        *ngFor="
                                            let table of rowsArray;
                                            let i = index
                                        "
                                    >
                                        <!-- <td >
                                                 <label>{{table.recid}}-{{table.recname}}</label>

                                                </td> -->
                                        <td *ngIf="isAdhocpoVisible">
                                            {{ i + 1 }}
                                        </td>
                                        <td
                                            *ngFor="
                                                let key of Keys;
                                                let i = index
                                            "
                                        >
                                            <label *ngIf="key != 'Category'">{{
                                                table[key] ? table[key] : "0"
                                            }}</label>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- content goes here -->
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>
<!-- dialog  -->
<ng-template #adhocPopup let-modal>
    <div class="modal-header">
        <h4 class="modal-title pull-left">Enter Adhoc_PO Name</h4>
        <button
            type="button"
            class="close pull-right"
            aria-label="Close"
            (click)="OnClose()"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body text-center">
        <div class="form">
            <div class="form-group">
                <label for="validationCustom01" class="mb-1"
                    >Description:</label
                >
                <input
                    class="form-control"
                    required
                    type="text"
                    [formControl]="description"
                />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="onSavePopup()">
            Save
        </button>
        <button class="btn btn-primary" (click)="OnClose()">Cancel</button>
    </div>
</ng-template>
<ng-template #deleteDialog>
    <div mat-dialog-title class="dialog-title flex flex-row justify-between">
        <h4>Delete Record</h4>
        <button
            mat-icon-button
            aria-label="close dialog"
            (click)="CloseDialog()"
        >
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="mat-typography text-center">
        <p>Do you really want to delete this record?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" (click)="confirm()">
            Yes
        </button>
        <button mat-raised-button color="secondary" (click)="decline()">
            No
        </button>
    </mat-dialog-actions>
</ng-template>
