<section class="inset-0 flex flex-col min-w-0 h-screen">
    <!-- <i class="iconsvg icon-mushroom_adobe_express"></i> -->
    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent">
        <mat-drawer
            class="w-full sm:w-128 h-screen flex flex-auto overflow-y-auto dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="isMatDrawerOpened"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer
        >
            <div
                class="flex flex-auto overflow-y-auto"
                *ngIf="isMatDrawerOpened"
            >
                <form
                    class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto"
                    [formGroup]="TableFieldsForm"
                >
                    <!-- Header -->
                    <div class="flex justify-between -mt-3 -ml-4">
                        <div class="toggle">
                            <!-- <mat-slide-toggle>Edit Mode</mat-slide-toggle> -->
                        </div>
                        <div class="flex items-center">
                            <!-- Close button -->
                            <a mat-icon-button (click)="OnClose()">
                                <mat-icon
                                    [svgIcon]="'heroicons_outline:x'"
                                ></mat-icon>
                            </a>
                        </div>
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>

                    <!-- Title -->
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Employee ID:</label
                        >
                        <select
                            name=""
                            id=""
                            class="form-control"
                            formControlName="employeeId"
                            (change)="OnEmployeeChange($event.target.value)"
                        >
                            <option>--Select--</option>
                            <option
                                *ngFor="let emps of empsData"
                                [value]="emps.stalloperatorid"
                            >
                                {{ emps.stalloperatorid }}-{{ emps.name }}
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Module Id:</label
                        >
                        <select
                            class="form-control"
                            required=""
                            formControlName="moduleId"
                            (change)="OnModuleChange($event.target.value)"
                        >
                            <option value="">--Select--</option>
                            <option
                                *ngFor="let all of moduleManagementData"
                                [value]="all.moduleId"
                            >
                                {{ all.moduleId }}-{{ all.moduleName }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Is Manage:</label
                        >
                        <input
                            type="checkbox"
                            class="form-check"
                            formControlName="manage"
                        />
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Is Active:</label
                        >
                        <input
                            type="checkbox"
                            class="form-check"
                            formControlName="active"
                        />
                    </div>

                    <mat-divider class="mt-6 mb-8"></mat-divider>
                    <div class="d-flex flex-row justify-content-between">
                        <button
                            class="btn btn-danger"
                            (click)="onDelPopup(deleteDialog)"
                        >
                            Delete
                        </button>
                        <button class="btn btn-primary" (click)="OnSavePopup()">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">
            <div class="flex flex-col flex-auto">
                <!-- Header -->
                <div class="flex flex-row justify-between py-8 px-6 md:px-8">
                    <!-- Title -->

                    <div
                        class="text-4xl font-extrabold tracking-tight leading-none"
                    >
                        Employee Assignment
                    </div>
                    <div class="button">
                        <button
                            class="btn btn-primary"
                            (click)="isMatDrawerOpened = true"
                        >
                            Add
                        </button>
                    </div>
                </div>
                <div class="divide-y">
                    <ng-container *ngFor="let assignment of empAssignmentData">
                        <div
                            class="grid grid-cols-3 hover:bg-gray-100 dark:hover:bg-hover"
                            (click)="OnEdit(assignment)"
                        >
                            <div class="col-span-1 pl-2">
                                <div class="row-span-1 text-lg font-bold">
                                    {{ assignment.employeeId }}-{{
                                        assignment.empName
                                    }}
                                </div>
                                <div class="row-span-1 text-lg font-bold">
                                    {{ assignment.moduleId }}-{{
                                        assignment.moduleName
                                    }}
                                </div>
                            </div>
                            <div class="col-span-1">
                                <div class="row-span-1 text-lg font-bold">
                                    Manage: {{ assignment.manage }}
                                </div>
                            </div>
                            <div class="col-span-1 text-lg font-bold">
                                <div class="row-span-1 text-lg font-bold">
                                    Active: {{ assignment.active }}
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>
<!-- dialog  -->
<ng-template #deleteDialog>
    <div mat-dialog-title class="dialog-title flex flex-row justify-between">
        <h4>Delete Record</h4>
        <button
            mat-icon-button
            aria-label="close dialog"
            (click)="CloseDialog()"
        >
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="mat-typography text-center">
        <p>Do you really want to delete this record?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" (click)="confirm()">
            Yes
        </button>
        <button mat-raised-button color="secondary" (click)="decline()">
            No
        </button>
    </mat-dialog-actions>
</ng-template>
