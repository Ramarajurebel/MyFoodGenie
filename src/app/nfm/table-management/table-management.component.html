<section class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <!-- <i class="iconsvg icon-mushroom_adobe_express"></i> -->
    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent">
        <mat-drawer
            class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="isMatDrawerOpened"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer
            ><div>
                <ng-container *ngIf="istableDetails">
                    <div class="flex flex-auto">
                        <form
                            class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto"
                            [formGroup]="TableFieldsFormGroup"
                        >
                            <div class="flex justify-between -mt-3 -ml-4">
                                <div class="flex items-center">
                                    <a mat-icon-button (click)="OnClose(false)">
                                        <mat-icon
                                            [svgIcon]="'heroicons_outline:x'"
                                        ></mat-icon>
                                    </a>
                                </div>
                            </div>
                            <!-- <div class="form-group">
                                <label for="" class="mb-1">Vendor Id</label>
                                <select
                                    name=""
                                    id=""
                                    class="form-control"
                                    formControlName="vendorId"
                                >
                                    <option value="">--Select--</option>
                                    <option
                                        *ngFor="let obj of vendorData"
                                        [value]="obj.vendorId"
                                    >
                                        {{ obj.vendorName }}
                                    </option>
                                </select>
                            </div> -->
                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1">
                                    Room Name:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="roomName"
                                    required
                                    type="text"
                                />
                            </div>
                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1"
                                    >Table Id :</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="tableId"
                                    type="text"
                                />
                            </div>
                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1"
                                    >Table Name :</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="tableName"
                                    type="text"
                                />
                            </div>
                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1">
                                    Seats:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="seats"
                                    type="text"
                                />
                            </div>
                            <div class="form-group mb-0">
                                <label
                                    for="validationCustom02"
                                    class="form-inline"
                                    >Status:</label
                                >
                                <select
                                    formControlName="status"
                                    class="form-control"
                                >
                                    <option
                                        *ngFor="let stat of status"
                                        [value]="stat"
                                    >
                                        {{ stat }}
                                    </option>
                                </select>
                            </div>
                                                       
                            <mat-divider class="mt-6 mb-8"></mat-divider>
                            <div
                                class="d-flex flex-row justify-content-between"
                            >
                                <button
                                    class="btn btn-danger"
                                    (click)="OnDel(deleteDialog)"
                                >
                                    Delete
                                </button>
                                <button
                                    class="btn btn-primary"
                                    (click)="OnSave()"
                                >
                                    Save
                                </button>
                            </div>
                        </form>
                    </div>
                </ng-container>
            </div>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">
            <div class="flex flex-col flex-auto">
                <!-- Header -->
                <div class="flex flex-row py-8 px-6 md:px-8">
                    <!-- Title -->
                    <div>
                        <div
                            class="text-4xl font-extrabold tracking-tight leading-none"
                        >
                            Dinning Tables
                        </div>
                    </div>

                    <div class="div header-btns ml-auto">
                        <button
                            class="ml-3"
                            mat-flat-button
                            [color]="'primary'"
                            (click)="OnBookTable()"
                        >
                            <!-- <mat-icon
                            [svgIcon]="'heroicons_outline:plus'"
                        ></mat-icon> -->
                            <!-- <mat-icon></mat-icon> -->

                            <span class="ml-2 mr-1">Add</span>
                        </button>
                        <!-- <button
                            class="btn btn-primary"
                            (click)="CopyRecipeModal(newrcpmodal)"
                        >
                            Copy Recipe
                        </button> -->
                    </div>
                    <div class="div"></div>
                    <div class="export"></div>
                </div>

                <div class="divide-y">
                    <ng-container>
                        <div *ngFor="let table of TableFieldsData; let i = index">
                            <div
                                class="d-flex flex-row items-center pl-3 w-100 h12 p-3 adhoc-po"
                                #lastDivRef
                            >
                                <div class="d-flex flex-column w-50 adhoc">
                                    <div
                                        class="text-lg font-semibold text-primary description"
                                    >
                                        <a
                                            class="cursor-pointer"
                                            (click)="
                                                OntableClick(table, $event)
                                            "
                                        >
                                            {{ table.diningTableId }}-{{
                                                table.roomName
                                            }}
                                        </a>
                                    </div>
                                    <div
                                        class="text-lg font-semibold text-primary"
                                    >
                                        Table Name: {{ table.tableName }}
                                    </div>
                                </div>

                                <div class="d-flex flex-column w-50 adhoc">
                                    <div
                                        class="text-lg font-semibold text-primary"
                                    >
                                        table Id: {{ table.tableId }} /
                                        {{ table.seats }}
                                    </div>
                                    <div
                                        class="h-8 text-lg font-semibold text-primary adhoc"
                                    >
                                        Status:
                                        {{ table.status }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>


<!-- delete dialog from below -->
<ng-template #deleteDialog>
    <div mat-dialog-title class="dialog-title flex flex-row justify-between">
        <h4>Delete Record</h4>
        <button
            mat-icon-button
            aria-label="close dialog"
            (click)="CloseDialog()"
        >
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="mat-typography text-center">
        <p>Do you really want to delete this record?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" (click)="confirm()">
            Yes
        </button>
        <button mat-raised-button color="secondary" (click)="decline()">
            No
        </button>
    </mat-dialog-actions>
</ng-template>
