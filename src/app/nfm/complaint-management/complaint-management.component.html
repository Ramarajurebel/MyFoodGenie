<section class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <!-- <i class="iconsvg icon-mushroom_adobe_express"></i> -->
    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent">
        <mat-drawer
            class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="isMatDrawerOpened"
            [position]="'end'"
            [disableClose]="true"
            #matDrawer
            ><div>
                <ng-container *ngIf="isComplaintDetails">
                    <div class="flex flex-auto">
                        <form
                            class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto"
                            [formGroup]="complaintsFormGroup"
                        >
                            <div class="flex justify-between -mt-3 -ml-4">
                                <div class="flex items-center">
                                    <a mat-icon-button (click)="OnClose(false)">
                                        <mat-icon
                                            [svgIcon]="'heroicons_outline:x'"
                                        ></mat-icon>
                                    </a>
                                </div>
                            </div>
                            <!-- <div class="form-group">
                                <label for="" class="mb-1">Vendor Id</label>
                                <select
                                    name=""
                                    id=""
                                    class="form-control"
                                    formControlName="vendorId"
                                >
                                    <option value="">--Select--</option>
                                    <option
                                        *ngFor="let obj of vendorData"
                                        [value]="obj.vendorId"
                                    >
                                        {{ obj.vendorName }}
                                    </option>
                                </select>
                            </div> -->
                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1">
                                    Title:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="title"
                                    required
                                    type="text"
                                />
                            </div>

                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1"
                                    >Description :</label
                                >
                                <textarea
                                    class="form-control"
                                    formControlName="description"
                                    type="text"
                                ></textarea>
                            </div>
                            <div class="form-group">
                                <label for="" class="mb-1">Assigned To:</label>
                                <select
                                    name=""
                                    id=""
                                    formControlName="assignedTo"
                                    class="form-control"
                                >
                                    <option>--Select--</option>
                                    <option
                                        *ngFor="let emps of employeesList"
                                        [value]="emps.name"
                                    >
                                        {{ emps.stalloperatorid }}-{{
                                            emps.name
                                        }}
                                    </option>
                                </select>
                            </div>
                            <div class="form-group mb-0">
                                <label
                                    for="validationCustom02"
                                    class="form-inline"
                                    >Priority :</label
                                >
                                <select
                                    formControlName="priority"
                                    class="form-control"
                                >
                                    <option
                                        *ngFor="let prior of priority"
                                        [value]="prior"
                                    >
                                        {{ prior }}
                                    </option>
                                </select>
                            </div>
                            <div class="form-group mb-0">
                                <label
                                    for="validationCustom02"
                                    class="form-inline"
                                    >Status:</label
                                >
                                <select
                                    formControlName="status"
                                    class="form-control"
                                >
                                    <option
                                        *ngFor="let stat of status"
                                        [value]="stat"
                                    >
                                        {{ stat }}
                                    </option>
                                </select>
                            </div>
                            <div class="form-group mb-0">
                                <label for="validationCustom02" class="mb-1"
                                    >Comments:</label
                                >
                                <textarea
                                    rows="5"
                                    class="form-control"
                                    formControlName="comments"
                                ></textarea>
                            </div>
                            <div class="form-group">
                                <label for="" class="mb-1">Due Date:</label>
                                <input
                                    type="date"
                                    formControlName="dueDate"
                                    class="form-control"
                                />
                            </div>
                            <div class="form-group mb-0" *ngIf="editMode">
                                <label for="validationCustom02" class="mb-1"
                                    >Created By:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="createdBy"
                                    type="text"
                                />
                            </div>
                            <div class="form-group mb-0" *ngIf="editMode">
                                <label for="validationCustom02" class="mb-1"
                                    >Created Date:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="createdDate"
                                    type="date"
                                />
                            </div>

                            <div class="form-group mb-0" *ngIf="editMode">
                                <label for="validationCustom02" class="mb-1"
                                    >Updated By:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="updatedBy"
                                    required
                                    type="text"
                                />
                            </div>
                            <div class="form-group mb-0" *ngIf="editMode">
                                <label for="validationCustom02" class="mb-1"
                                    >Updated Date:</label
                                >
                                <input
                                    class="form-control"
                                    formControlName="updatedDate"
                                    type="date"
                                />
                            </div>
                            <!-- <div class
                                ="form-group mb-0">
                                      <label for="validationCustom02" class="mb-1">Description:</label>
                                      <input matInput class="form-control" formControlName="description" required type="text"  />
                                      <div *ngIf="validation">
                                      <mat-error *ngIf="recipeFormgroup.controls['description'].hasError('required')">
                                        <strong>required</strong>
                                      </mat-error>
                                      </div>

                                  </div> -->

                            <mat-divider class="mt-6 mb-8"></mat-divider>
                            <div
                                class="d-flex flex-row justify-content-between"
                            >
                                <button
                                    class="btn btn-danger"
                                    (click)="OnDel(deleteDialog)"
                                >
                                    Delete
                                </button>
                                <button
                                    class="btn btn-primary"
                                    (click)="OnSaveCompliant()"
                                >
                                    Save
                                </button>
                            </div>
                        </form>
                    </div>
                </ng-container>
            </div>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">
            <div class="flex flex-col flex-auto">
                <!-- Header -->
                <div class="flex flex-row py-8 px-6 md:px-8">
                    <!-- Title -->
                    <div>
                        <div
                            class="text-4xl font-extrabold tracking-tight leading-none"
                        >
                            Complaint Management
                        </div>
                    </div>

                    <div class="div header-btns ml-auto">
                        <button
                            class="ml-3"
                            mat-flat-button
                            [color]="'primary'"
                            (click)="OnAddComplaint()"
                        >
                            <!-- <mat-icon
                            [svgIcon]="'heroicons_outline:plus'"
                        ></mat-icon> -->
                            <!-- <mat-icon></mat-icon> -->

                            <span class="ml-2 mr-1">Add</span>
                        </button>
                        <!-- <button
                            class="btn btn-primary"
                            (click)="CopyRecipeModal(newrcpmodal)"
                        >
                            Copy Recipe
                        </button> -->
                    </div>
                    <div class="div"></div>
                    <div class="export"></div>
                </div>

                <div class="divide-y">
                    <ng-container>
                        <div *ngFor="let comp of complaintsData; let i = index">
                            <div
                                class="d-flex flex-row items-center pl-3 w-100 h12 p-3 adhoc-po"
                                #lastDivRef
                            >
                                <div class="d-flex flex-column w-50 adhoc">
                                    <div
                                        class="text-lg font-semibold text-primary description"
                                    >
                                        <a
                                            class="cursor-pointer"
                                            (click)="
                                                OnComplaintClick(comp, $event)
                                            "
                                        >
                                            {{ comp.complaintId }}-{{
                                                comp.title
                                            }}
                                        </a>
                                    </div>
                                    <div
                                        class="text-lg font-semibold text-primary"
                                    >
                                        Description: {{ comp.description }}
                                    </div>
                                </div>

                                <div class="d-flex flex-column w-50 adhoc">
                                    <div
                                        class="text-lg font-semibold text-primary"
                                    >
                                        Priority: {{ comp.priority }} /
                                        {{ comp.status }}
                                    </div>
                                    <div
                                        class="h-8 text-lg font-semibold text-primary adhoc"
                                    >
                                        Assigned To:
                                        {{ comp.assignedTo }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</section>

<ng-template #content let-modal>
    <div class="modal-header">
        <h5 class="modal-title f-w-600" id="exampleModalLabel">Choose</h5>
        <button
            type="button"
            class="close"
            aria-label="Close"
            (click)="OnClose('Cross Click')"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <form class="needs-validation">
                <div class="form">
                    <div class="form-group">
                        <label class="mb-1">Purchase Order:</label>
                        <select
                            class="form-control"
                            [formControl]="purchaseorder"
                        >
                            <option value="">--Select--</option>
                            <option
                                *ngFor="let adhoc of adhocPoData"
                                [value]="adhoc.adhocpoid"
                            >
                                {{ adhoc.adhocpoid }}-{{ adhoc.description }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="mb-1">Categories:</label>
                        <select class="form-control" [formControl]="category">
                            <option value="All">All</option>
                            <option
                                [value]="val"
                                *ngFor="let val of categories"
                            >
                                {{ val }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="validationCustom01" class="mb-1"
                            >Available:</label
                        >
                        <select class="form-control" [formControl]="available">
                            <option value="All">All</option>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                        <!-- <div *ngIf="validation">
                    <mat-error *ngIf="recipeFormgroup.controls['prodname'].hasError('required')">
                      <strong >required</strong>
                    </mat-error>
                  </div> -->
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="onSavePopup()">
            Save
        </button>
        <button
            class="btn btn-secondary"
            type="button"
            data-dismiss="modal"
            (click)="OnClose('Cross Click')"
        >
            Close
        </button>
    </div>
</ng-template>
<!-- delete dialog from below -->
<ng-template #deleteDialog>
    <div mat-dialog-title class="dialog-title flex flex-row justify-between">
        <h4>Delete Record</h4>
        <button
            mat-icon-button
            aria-label="close dialog"
            (click)="CloseDialog()"
        >
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content class="mat-typography text-center">
        <p>Do you really want to delete this record?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button color="primary" (click)="confirm()">
            Yes
        </button>
        <button mat-raised-button color="secondary" (click)="decline()">
            No
        </button>
    </mat-dialog-actions>
</ng-template>
