<div class="flex flex-col flex-auto min-w-0" *ngIf="user">
    <!--Header-->
    <div class="bg-card">
        <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
            <div
                class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-8 sm:my-12"
            >
                <!-- Avatar and name -->
                <div class="flex flex-auto items-center min-w-0">
                    <div class="flex-0 w-18 h-18 rounded-full overflow-hidden">
                        <img
                            class="w-full h-full object-cover"
                            *ngIf="usrImg"
                            [src]="usrImg"
                        />
                    </div>
                    <div class="flex flex-col min-w-0 ml-4">
                        <div
                            id="google_translate"
                            style="display: none !important"
                        >
                            <!-- <button
                                class="btn btn-primary"
                                *ngIf="!isInstalled"
                                (click)="installApp()"
                            >
                                Install App
                            </button> -->
                        </div>
                        <ng-container *transloco="let t">
                            <div
                                class="text-2xl md:text-5xl font-semibold tracking-tight leading-7 md:leading-snug truncate"
                            >
                                {{ user.userName }}!
                            </div>
                        </ng-container>
                        <div class="flex items-center">
                            <!-- <mat-icon
                                class="icon-size-5"
                                [svgIcon]="'heroicons_solid:bell'"
                            ></mat-icon> -->
                            <!-- <div
                                class="ml-1.5 leading-6 truncate text-secondary"
                            >
                                You have 2 new messages and 15 new tasks
                            </div> -->
                        </div>
                    </div>
                </div>
                <div class="ml-auto">
                    <div class="flex flex-col gap-2">
                        <mat-slide-toggle
                            class="text-lg"
                            color="primary"
                            (change)="LoginLogout($event.checked)"
                            [(ngModel)]="loginState"
                            >{{
                                loginState ? "Punch Out" : "Punch In"
                            }}</mat-slide-toggle
                        >
                        <div class="flex flex-row gap-2">
                            <label for="" class="mb-1">Language:</label>
                            <select
                                name=""
                                id=""
                                class="form-control"
                                (change)="OnLangChange($event.target.value)"
                                [formControl]="langSelect"
                            >
                                <option value="te">
                                    Telugu- తెలుగు-तेलुगु
                                </option>
                                <option value="hi">Hindi- हिंदी-హిందీ</option>
                                <option value="en">
                                    English-ఆంగ్ల-अंग्रेज़ी
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
                <!-- Actions -->
                <div class="flex items-center mt-6 sm:mt-0 sm:ml-2 space-x-3">
                    <!-- <button
                        class="bg-accent"
                        mat-flat-button
                        [color]="'accent'"
                    >
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:mail'"
                        ></mat-icon>
                        <span class="ml-2">Messages</span>
                    </button> -->
                    <!-- <button mat-flat-button [color]="'primary'">
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:cog'"
                        ></mat-icon>
                        <span class="ml-2">Settings</span>
                    </button> -->
                </div>
            </div>
            <!-- Project selector -->
        </div>
    </div>
    <!--Header completes-->
    <!-- Main -->
    <div
        class="flex-auto border-t -mt-px pt-4 sm:pt-6 overflow-auto"
        *ngIf="assignedTiles.length > 0"
    >
        <div class="w-full max-w-screen-xl mx-auto">
            <!--Content Tiles-->
            <div class="flex flex-row allcards p-2" style="gap: 10px">
                <!-- <div class="card" style="width: 11rem; height: 11rem">
                    <div
                        class="flex justify-center bg-white font-bold"
                        style="border-bottom: 0"
                    >
                        <mat-icon
                            svgIcon="heroicons_solid:beaker"
                            class="w-15 h-14 text-blue-500"
                        ></mat-icon>
                    </div>
                    <div
                        class="flex flex-col justify-center align-items-center gap-2 card-body"
                    >
                        <div
                            class="font-bold text-4xl text-blue-500"
                            (click)="OnNavigate('nfm/kitchen-tasks/lunch-prep')"
                        >
                            {{
                                lunch_DinnerPrepCount
                                    ? lunch_DinnerPrepCount
                                    : 0
                            }}
                        </div>
                        <div class="text-sm font-bold text-black-600">
                            Kitchen Preparation
                            <span>Lunch-Dinner</span>
                        </div>
                    </div>
                </div> -->
                <ng-container *ngFor="let tile of assignedTiles">
                    <ng-container *ngIf="!tile?.hidden">
                        <div
                            class="rounded-lg bg-card overflow-hidden shadow w-40 h-40"
                        >
                            <div
                                class="flex justify-center bg-white font-bold"
                                style="border-bottom: 0"
                            >
                                <mat-icon
                                    [svgIcon]="tile.icon"
                                    [class]="tile.iconClass"
                                ></mat-icon>
                            </div>
                            <div
                                class="flex flex-col justify-center align-items-center gap-2 card-body"
                            >
                                <div
                                    [class]="tile.class"
                                    *ngIf="user.mobileNumber == '9618812143'"
                                    (click)="OnNavigate(tile.moduleName)"
                                >
                                    {{ tile.count }}
                                </div>
                                <div
                                    class="text-sm font-bold text-blue-600 cursor-pointer"
                                    (click)="OnNavigate(tile.moduleName)"
                                >
                                    {{ tile.description }}
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </ng-container>
            </div>
        </div>
    </div>
</div>
